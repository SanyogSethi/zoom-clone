[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom-clone-scaleraai-assessment-backend"
version = "0.1.0"
description = "FastAPI backend for Zoom Clone ScalerAI Assessment"
authors = [
    { name = "sanyog-sethi" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "httpx>=0.26.0"
]
